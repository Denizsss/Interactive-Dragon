<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Dragon - Final</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #111827;
      }

      svg {
        width: 100vw;
        height: 100vh;
        display: block;
      }

      /* Vinyet efekti (kenarlardan kararma) */
      .vignette {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        background: radial-gradient(
          circle at center,
          rgba(0, 0, 0, 0) 60%,
          rgba(0, 0, 0, 0.6) 100%
        );
      }
    </style>
  </head>

  <body>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      id="dragon"
      viewBox="0 0 1920 1080"
      preserveAspectRatio="xMidYMid slice"
    >
      <!-- Arka plan gradyanı -->
      <defs>
        <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#111827" />
          <stop offset="100%" stop-color="#374151" />
        </linearGradient>
      </defs>

      <!-- Arka plan -->
      <rect width="100%" height="100%" fill="url(#bgGradient)" />

      <!-- Ejderha parçaları -->
      <g id="Cabeza">
        <path d="M0,0 L60,30 L0,60 Z" fill="#fff" />
        <path d="M0,0 L60,30 L0,60 Z" stroke="#000" stroke-width="2" fill="none" />
      </g>
      <g id="Aletas">
        <path
          d="M100,300 C400,100 700,100 1000,300"
          fill="none"
          stroke="#ccc"
          stroke-width="8"
        />
      </g>
      <g id="Espina">
        <path
          d="M500,500 C550,400 600,400 650,500"
          fill="none"
          stroke="#888"
          stroke-width="5"
        />
      </g>

      <!-- Hareketli grup -->
      <g id="screen"></g>
    </svg>

    <div class="vignette"></div>

      const spine = document.getElementById("Espina").cloneNode(true);

      screenGroup.appendChild(spine);
      screenGroup.appendChild(head);
